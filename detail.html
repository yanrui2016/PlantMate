<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>植物详情 · 植物养植助手</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav id="nav"></nav>
<main id="main"></main>
<script src="js/config.js"></script>
<script src="js/storage.js"></script>
<script src="js/demo.js"></script>
<script src="js/weather.js"></script>
<script src="js/water.js"></script>
<script src="js/update.js"></script>
<script src="js/judge.js"></script>
<script src="js/ui.js"></script>
<script>
renderNav('home');
let data = loadData();
const id = Number(getQuery('id'));

// 最近14天的水分变化折线图
function chartSvg(plant, line) {
  const start = addDays(todayStr(), -13);
  const pts = (plant.history || []).filter(h => h.date >= start);
  if (pts.length < 2) return '<p class="muted">记录满两天后，这里会画出水分变化。</p>';
  const X = d => 50 + daysBetween(start, d) * 48, Y = v => 200 - v * 1.6;
  const poly = pts.map(h => X(h.date) + ',' + Y(h.v)).join(' ');
  return '<svg viewBox="0 0 720 235" role="img" aria-label="最近两周水分余额折线图">' +
    '<line x1="50" y1="200" x2="700" y2="200" stroke="#56625a"/>' +
    '<line x1="50" y1="' + Y(line) + '" x2="700" y2="' + Y(line) + '" stroke="#8a4b0f" stroke-width="1.5" stroke-dasharray="6 5"/>' +
    '<text x="600" y="' + (Y(line) - 8) + '" font-size="13" fill="#8a4b0f">提醒线 ' + line + '%</text>' +
    '<text x="4" y="44" font-size="12" fill="#56625a">100%</text><text x="20" y="204" font-size="12" fill="#56625a">0%</text>' +
    '<polyline points="' + poly + '" fill="none" stroke="#2f7fb5" stroke-width="3" stroke-linejoin="round"/>' +
    pts.map(h => '<circle cx="' + X(h.date) + '" cy="' + Y(h.v) + '" r="3.5" fill="#2f7fb5"/>').join('') +
    '<text x="50" y="222" font-size="12" fill="#56625a">' + shortDate(start) + '</text><text x="664" y="222" font-size="12" fill="#56625a">今天</text></svg>';
}

function render() {
  const plant = findPlant(data, id);
  const main = document.getElementById('main');
  if (!plant) { main.innerHTML = '<div class="card empty"><p>找不到这盆植物。</p><p><a href="index.html">返回首页</a></p></div>'; return; }
  document.title = plant.name + ' · ' + APP_NAME;
  const p = getParams(data);
  const sp = p.plants[plant.species];
  const days = data.weatherCache ? data.weatherCache.days : null;
  const w = days ? days[todayStr()] : null;
  const obs = recentObs(plant);
  const advice = judgePlant(plant, obs, p, days);
  const st = waterStatus(plant, p);

  main.innerHTML =
    '<div class="head-row"><div style="display:flex;align-items:center;gap:14px"><span class="avatar">' + icon('leaf', 28) + '</span>' +
    '<div><h1>' + esc(plant.name) + '</h1><p class="muted">' + esc(plantDesc(plant, p)) + '，明亮光照' + BRIGHT_OPTIONS[plant.bright] + '，直射' + SUN_OPTIONS[plant.sun] + '</p></div></div>' +
    '<div class="btn-row"><a href="add.html?id=' + plant.id + '">修改</a><a href="#" id="del">删除</a><a href="index.html">返回首页</a></div></div>' +

    '<div class="row"><section class="card" aria-label="水分"><h2 style="display:flex;gap:8px;align-items:center;color:var(--water)">' + icon('drop') + '水分余额</h2>' +
    '<div class="big-num">' + Math.round(plant.balance) + '%</div><div style="margin:14px 0 8px">' + waterBar(plant, p, true) + '</div>' +
    '<p class="muted">橙色竖线是提醒线：' + sp.line + '%</p><p style="margin-top:8px">' + statusChip(st) + ' <span class="muted">' + daysText(daysToWater(plant, w, p)) + '</span></p></section>' +
    '<section class="card wide" aria-label="现在的建议"><h2>现在的建议</h2>' + advice.map(a => adviceHtml(a, false)).join('') +
    (obs ? '<p class="muted" style="margin-top:10px">参考了' + shortDate(plant.lastDiag.date) + '的拍照诊断</p>' : '') + '</section></div>' +

    '<div class="btn-row"><button class="btn btn-primary" id="b-full">' + icon('drop') + '我浇透了</button>' +
    '<button class="btn" id="b-little">浇了一点</button>' +
    '<button class="btn" id="b-feel">' + icon('hand') + '我摸了一下土</button>' +
    '<a class="btn" href="diagnose.html?id=' + plant.id + '">' + icon('camera') + '拍照诊断</a></div>' +

    '<div class="row"><section class="card wide chart"><h2>最近两周的水分变化</h2>' + chartSvg(plant, sp.line) + '<p class="muted">每次往上跳就是一次浇水或校正</p></section>' +
    '<section class="card"><h2>记录</h2><ul class="logs">' +
    (plant.logs || []).slice(0, 12).map(l => '<li><span>' + shortDate(l.date) + '</span><span>' + esc(l.text) + '</span></li>').join('') + '</ul></section></div>';

  document.getElementById('b-full').onclick = async () => {
    if (plant.balance >= p.fullLine) {
      const go = await dialog('土还很湿，确定要浇吗？', '<p>' + esc(plant.name) + '现在的水分是' + Math.round(plant.balance) + '%，已经超过' + p.fullLine + '%。浇水太多，根可能会烂掉。</p>',
        [{ text: '先不浇了', value: false, primary: true }, { text: '还是要浇', value: true }]);
      if (!go) return;
    }
    waterPlant(plant, 'full', p); saveData(data); toast('已记录：浇透'); render();
  };
  document.getElementById('b-little').onclick = () => { waterPlant(plant, 'little', p); saveData(data); toast('已记录：浇了一点'); render(); };
  document.getElementById('b-feel').onclick = async () => {
    const feel = await dialog('土摸起来怎么样？', '<p>把手指插进土里2到3厘米，感觉一下。选完后水分会改成' + p.calib.wet + '% / ' + p.calib.some + '% / ' + p.calib.dry + '%。</p>',
      [{ text: '还很湿', value: 'wet' }, { text: '有点干', value: 'some' }, { text: '很干', value: 'dry' }, { text: '取消', value: null }]);
    if (!feel) return;
    calibrate(plant, feel, p); saveData(data); toast('水分已校正'); render();
  };
  document.getElementById('del').onclick = async e => {
    e.preventDefault();
    const ok = await dialog('删除' + plant.name + '？', '<p>它的所有记录都会被删除，不能恢复。</p>', [{ text: '取消', value: false, primary: true }, { text: '删除', value: true }]);
    if (!ok) return;
    data.plants = data.plants.filter(x => x.id !== plant.id); saveData(data); location.href = 'index.html';
  };
}

render();
updateAll(data).then(render);
</script>
</body>
</html>
